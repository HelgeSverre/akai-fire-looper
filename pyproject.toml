[project]
name = "akai-fire-looper"
version = "0.1.0"
description = "Python library and application framework for controlling the AKAI Fire and building custom controller applications."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-rtmidi>=1.5.8",
    "pillow>=11.1.0",
]
keywords = ["akai-fire", "midi", "controller", "oled", "framework"]

[project.urls]
Repository = "https://github.com/HelgeSverre/akai-fire-looper"
Documentation = "https://github.com/HelgeSverre/akai-fire-looper/blob/main/README.md#documentation"
Issues = "https://github.com/HelgeSverre/akai-fire-looper/issues"

[project.optional-dependencies]
pygame = ["pygame>=2.6.0"]
tui = ["rich>=13"]
examples = ["transitions>=0.9.2"]
dev = [
    "black>=25.1.0",
    "ruff>=0.17.4",
]

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# Explicit package list: the repo root also holds dev conveniences
# (mock GUIs, screen_manager, examples) that are not part of the
# installable surface.
packages = [
    "akai_fire",
    "akai_fire_framework",
    "akai_fire_testing",
]

[tool.black]
line-length = 88
